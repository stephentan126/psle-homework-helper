name: Backend

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # The runner has no GPU, so it installs the PyPI build of the same torch version instead of
      # the CUDA 11.8 build used on the target laptop.
      - name: Install dependencies
        run: |
          sed -i 's/"torch==2.7.1+cu118"/"torch==2.7.1"/' pyproject.toml
          pip install -e ".[dev]"
      - name: Run the tests that need no GPU or downloaded models
        run: python -m pytest -m "not gpu" -q
